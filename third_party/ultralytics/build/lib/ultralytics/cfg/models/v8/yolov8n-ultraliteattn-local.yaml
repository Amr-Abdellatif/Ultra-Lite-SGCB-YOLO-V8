# YOLOv8 "Lite-P2" for VisDrone (Optimized for 384px Input)
# Contribution: High-Res P2 Head + SGCB (No Pooling)

# Parameters
nc: 10
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024] 
  m: [0.67, 0.75, 768] 
  l: [1.00, 1.00, 512] 
  x: [1.00, 1.25, 512] 
  
# Backbone
backbone:
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  
  # P2 Backbone: Keep Standard C2f for raw pixel detail
  - [-1, 2, C2f, [128, True]]          # 2 (96x96 resolution at 384 input)
  
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  # P3 Backbone: SGCB adds context without killing 48x48 grid
  - [-1, 2, SGCB, [256, True, 1, 0.5, 7]] # 4 
  
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16
  - [-1, 2, SGCB, [512, True, 1, 0.5, 7]] # 6 
  
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 2, C2f, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5]]           # 9

# Head (4-Head Architecture for Max Resolution)
head:
  # Up to P4
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, SGCB, [512, False, 1, 0.5, 7]] # 12

  # Up to P3
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, SGCB, [256, False, 1, 0.5, 7]] # 15

  # Up to P2 (The "Thesis Boost" Layer)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 2], 1, Concat, [1]]          # Cat with Backbone P2
  - [-1, 2, C2f, [128]]                # 18 (Keep strictly Standard to preserve pixels)

  # Detect Heads
  - [-1, 1, Conv, [128, 3, 2]]         # Down to P3
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 2, SGCB, [256, False, 1, 0.5, 7]] # 21 (P3 Head)

  - [-1, 1, Conv, [256, 3, 2]]         # Down to P4
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 2, SGCB, [512, False, 1, 0.5, 7]] # 24 (P4 Head)

  - [-1, 1, Conv, [512, 3, 2]]         # Down to P5
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 2, C2f, [1024]]               # 27 (P5 Head)

  # Detect on 4 layers: P2 (Smallest), P3, P4, P5
  - [[18, 21, 24, 27], 1, Detect, [nc]]